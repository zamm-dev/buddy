repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        types: [dart]
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze
        language: system
        types: [dart]
        pass_filenames: false
      - id: mkdocs-build
        name: mkdocs build --strict
        entry: bash -c 'cd docs && uv run mkdocs build --strict'
        language: system
        files: ^docs/
        pass_filenames: false
